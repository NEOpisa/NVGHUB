<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Neovanguard">
  <!-- ÍCONE DE APP (apple-touch-icon, PWA) — o mesmo campo azul do favicon,
       mas com o V OFICIAL inteiro, farpas e tudo.

       Existem dois masters de ícone porque existem dois tamanhos de uso, e
       eles pedem coisas opostas:

       · icone.svg roda de 16 a 32px na aba do navegador. Ali o V oficial
         tem sete detalhes atravessando 15px e nenhum sobrevive, então o
         glifo é uma versão grossa de dois braços.
       · este roda de 60 a 192px na tela inicial do telefone. Nesse tamanho
         a farpa externa e o entalhe aparecem, e usar o glifo grosso seria
         jogar a marca fora sem ganhar nada.

       O campo é o mesmo dos dois, então eles se leem como a mesma família —
       com uma diferença: aqui ele sangra até a borda (ver abaixo). A lâmina
       é branca e a extrusão é azul mais fundo: sobre campo azul, cromado
       viraria azul sobre azul. -->
  <defs>
    <linearGradient id="a-campo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3f63e8"/>
      <stop offset="0.52" stop-color="#1230d6"/>
      <stop offset="1" stop-color="#0000a8"/>
    </linearGradient>
    <linearGradient id="a-lamina" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#bfd2f8"/>
    </linearGradient>
  </defs>

  <!-- SANGRIA TOTAL, sem canto arredondado: iOS e Android aplicam a própria
       máscara por cima. Arredondar aqui daria canto duplo no iPhone e, no
       Android, o recorte comeria os cantos e sobraria uma borda serrilhada.
       O V cabe no círculo seguro de 80% (fica a 375 do centro, o limite é
       409), então nenhum recorte encosta nele. -->
  <rect width="1024" height="1024" fill="url(#a-campo)"/>

  <g transform="translate(512,516) scale(0.84) translate(-640,-568)">
    <!-- paredes da extrusão, em azul fundo -->
    <g fill="#000f7a">
      <path d="M492 306 L278 369 L296 384 L510 321 Z"/>
      <path d="M278 369 L424 578 L442 593 L296 384 Z"/>
      <path d="M640 830 L658 845 L538 323 L520 308 Z"/>
      <path d="M424 578 L350 409 L368 424 L442 593 Z"/>
      <path d="M788 306 L1002 369 L984 384 L770 321 Z"/>
      <path d="M1002 369 L856 578 L838 593 L984 384 Z"/>
      <path d="M640 830 L622 845 L742 323 L760 308 Z"/>
      <path d="M856 578 L930 409 L912 424 L838 593 Z"/>
    </g>
    <!-- face de trás -->
    <g fill="#00097e" transform="translate(18,15)">
      <path d="M492 306 L278 369 L424 578 L350 409 L477 377 L640 830 L520 308 Z"/>
      <path d="M788 306 L1002 369 L856 578 L930 409 L803 377 L640 830 L760 308 Z"/>
    </g>
    <!-- face da frente -->
    <g fill="url(#a-lamina)">
      <path d="M492 306 L278 369 L424 578 L350 409 L477 377 L640 830 L520 308 Z"/>
      <path d="M788 306 L1002 369 L856 578 L930 409 L803 377 L640 830 L760 308 Z"/>
    </g>
    <!-- esmalte: sobre campo azul ele fecha, não abre -->
    <g fill="#1230d6">
      <path d="M520 308 L577 348 L629 782 Z"/>
      <path d="M477 377 L350 409 L424 578 L396 421 L485 404 Z"/>
      <path d="M760 308 L703 348 L651 782 Z"/>
      <path d="M803 377 L930 409 L856 578 L884 421 L795 404 Z"/>
    </g>
  </g>
</svg>
