name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      # JavaScript inicial referenciado pelo HTML da home, sem compressão.
      # Compatível com o build do App Router usando Turbopack.
      - name: Bundle budget (home)
        run: node scripts/check-bundle-budget.mjs
      - name: Sitemap and multilingual SEO
        run: |
          npm start -- --port 3100 &
          seo_server_pid=$!
          trap 'kill "$seo_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3100/sitemap.xml > /dev/null; then break; fi
            sleep 1
          done
          node scripts/seo-qa.mjs

  # #099 · Lighthouse nas páginas-chave (informativo, não bloqueia)
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: |
          npm start & sleep 8
          npx --yes @lhci/cli autorun \
            --collect.url=http://localhost:3000/ \
            --collect.url=http://localhost:3000/en \
            --collect.url=http://localhost:3000/en/features \
            --collect.url=http://localhost:3000/baixar \
            --collect.url=http://localhost:3000/documentacao \
            --collect.numberOfRuns=1 \
            --upload.target=temporary-public-storage || true
